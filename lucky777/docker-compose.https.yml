# HTTPS overlay, enabled by setup-server.sh when you give it a domain:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data

volumes:
  caddy-data:
