# Render blueprint: push the repo to GitHub, then render.com -> New -> Blueprint.
# NOTE: Render's free tier has no persistent disk, so the SQLite file (your
# whole ledger) is wiped on every deploy or restart. Fine for showing people;
# for a real book use the Starter plan with the disk below, or a VPS.
services:
  - type: web
    name: lucky777
    runtime: docker
    plan: starter          # change to `free` for a throwaway demo (no disk!)
    disk:
      name: lucky777-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: LUCKY777_JWT_SECRET
        generateValue: true
      - key: LUCKY777_ADMIN_USERNAME
        value: brock
      - key: LUCKY777_ADMIN_PASSWORD
        sync: false        # you type it once in the Render dashboard
      # real lines + live scores, pre-wired (repo must stay PRIVATE)
      - key: LUCKY777_ODDS_PROVIDER
        value: the_odds_api
      - key: LUCKY777_ODDS_API_KEY
        value: cdf45a267ea57478898e834d5344a5d3
      - key: LUCKY777_LIVE_SCORES_POLL_SECONDS
        value: "60"
      - key: LUCKY777_BOARD_SYNC_MINUTES
        value: "30"
      # auto-stock player props for the marquee leagues (off by default; the
      # live feed pulls props per-game, budgeted to 40 games a run)
      - key: LUCKY777_PROPS_SYNC_HOURS
        value: "6"
